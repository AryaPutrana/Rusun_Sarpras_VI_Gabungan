<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Background Circle -->
  <circle cx="40" cy="40" r="38" fill="#10b981" opacity="0.1"/>
  <circle cx="40" cy="40" r="35" fill="#10b981"/>
  
  <!-- Government Building Icon -->
  <g fill="white">
    <!-- Roof Triangle -->
    <polygon points="40,18 25,28 55,28" fill="white"/>
    
    <!-- Columns -->
    <rect x="28" y="28" width="4" height="20" fill="white"/>
    <rect x="36" y="28" width="4" height="20" fill="white"/>
    <rect x="44" y="28" width="4" height="20" fill="white"/>
    <rect x="52" y="28" width="4" height="20" fill="white"/>
    
    <!-- Base -->
    <rect x="25" y="48" width="30" height="4" fill="white"/>
    
    <!-- Steps -->
    <rect x="23" y="52" width="34" height="3" fill="white" opacity="0.7"/>
  </g>
  
  <!-- Text -->
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#10b981" text-anchor="middle">
    DPRKP
  </text>
