<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="50" cy="50" r="48" fill="#4f46e5" opacity="0.1"/>
  <circle cx="50" cy="50" r="45" fill="url(#grad1)"/>
  
  <!-- Apartment Building Icon -->
  <g fill="white">
    <!-- Main Building -->
    <rect x="30" y="22" width="40" height="48" fill="white"/>
    
    <!-- Windows Grid -->
    <rect x="34" y="26" width="6" height="6" fill="#4f46e5"/>
    <rect x="42" y="26" width="6" height="6" fill="#4f46e5"/>
    <rect x="50" y="26" width="6" height="6" fill="#4f46e5"/>
    <rect x="58" y="26" width="6" height="6" fill="#4f46e5"/>
    
    <rect x="34" y="35" width="6" height="6" fill="#4f46e5"/>
    <rect x="42" y="35" width="6" height="6" fill="#4f46e5"/>
    <rect x="50" y="35" width="6" height="6" fill="#4f46e5"/>
    <rect x="58" y="35" width="6" height="6" fill="#4f46e5"/>
    
    <rect x="34" y="44" width="6" height="6" fill="#4f46e5"/>
    <rect x="42" y="44" width="6" height="6" fill="#4f46e5"/>
    <rect x="50" y="44" width="6" height="6" fill="#4f46e5"/>
    <rect x="58" y="44" width="6" height="6" fill="#4f46e5"/>
    
    <rect x="34" y="53" width="6" height="6" fill="#4f46e5"/>
    <rect x="42" y="53" width="6" height="6" fill="#4f46e5"/>
    <rect x="50" y="53" width="6" height="6" fill="#4f46e5"/>
    <rect x="58" y="53" width="6" height="6" fill="#4f46e5"/>
    
    <!-- Door -->
    <rect x="44" y="62" width="12" height="8" fill="#4f46e5"/>
  </g>
  
  <!-- Text -->
  <text x="50" y="88" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4f46e5" text-anchor="middle">
    UPRS VI
  </text>
</svg>
